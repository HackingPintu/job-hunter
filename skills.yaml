# Role families: choose what you are looking for. "search" feeds the search box of API-driven career sites.
roles:
  backend:
    label: Backend / Java / API
    include: [backend, back-end, "back end", "java developer", "java engineer", "api engineer", "server side", "application developer", "platform engineer", "services engineer"]
    search: ["backend engineer", "software engineer backend", "java developer"]
  fullstack:
    label: Full-stack
    include: ["full stack", full-stack, fullstack, "web developer"]
    search: ["full stack developer", "software engineer"]
  frontend:
    label: Frontend / UI
    include: [frontend, front-end, "front end", "ui engineer", "ui developer", "web ui", "react developer", "angular developer"]
    search: ["frontend engineer", "ui developer"]
  mobile:
    label: Mobile (Android / iOS)
    include: [android, ios, mobile, flutter, "react native"]
    search: ["android developer", "ios developer", "mobile engineer"]
  data:
    label: Data engineering
    include: ["data engineer", "data engineering", "etl", "big data", "analytics engineer", "data platform"]
    search: ["data engineer"]
  ml:
    label: ML / AI engineering
    include: ["machine learning", "ml engineer", "ai engineer", "applied scientist", "data scientist", "genai", "llm", "nlp", "research engineer"]
    search: ["machine learning engineer", "ai engineer"]
  devops:
    label: DevOps / SRE / Cloud
    include: [devops, sre, "site reliability", "cloud engineer", "infrastructure engineer", "platform engineer", "systems engineer"]
    search: ["devops engineer", "site reliability engineer", "cloud engineer"]
  qa:
    label: QA / SDET
    include: [sdet, "qa engineer", "test engineer", "quality engineer", "automation engineer", "software development engineer in test", "test automation"]
    search: ["sdet", "qa automation engineer", "test engineer"]
  security:
    label: Security engineering
    include: ["security engineer", "application security", "appsec", "cybersecurity", "security analyst"]
    search: ["security engineer"]
  embedded:
    label: Embedded / Systems
    include: [embedded, firmware, "systems software", "device driver", "kernel"]
    search: ["embedded software engineer", "firmware engineer"]

# Titles that identify a generic software role in any family.
generic_software_titles: ["software engineer", "software development engineer", "software developer", sde, swe, "member of technical staff", mts, "developer", "engineer", "programmer", "technologist"]

# Titles that are never relevant for an engineering job search.
always_exclude: [sales, marketing, recruiter, "account executive", "customer success", "solutions consultant", "product manager", "program manager", "project manager", "business analyst", "telecom", "operations engineer", "legal counsel", "accountant", "hr business partner", "talent acquisition", "support specialist", "technical writer", "intern", internship, trainee, apprentice, "head of", director, vp, "vice president", "chief"]

# Title words that belong to a role family. They are excluded when that family is not selected.
family_exclusive_titles:
  frontend: [frontend, front-end, "front end", "ui engineer", "ui developer"]
  mobile: [ios, android, mobile, flutter]
  data: ["data engineer", "data scientist", "analytics engineer"]
  ml: ["machine learning", "ml engineer", "ai engineer", "applied scientist", "research scientist", "research engineer"]
  devops: [devops, sre, "site reliability", "cloud engineer", "infrastructure engineer"]
  qa: [sdet, "qa engineer", "test engineer", "quality engineer", "quality assurance", qa, "test automation"]
  security: ["security engineer", "security analyst", "appsec"]
  embedded: [embedded, firmware, hardware, fpga, asic, "device driver"]
  other: [mainframe, "salesforce developer", "sap abap", consultant, "network engineer", "support engineer", "sales engineer", "solutions engineer", "customer engineer"]

