[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter"
version = "1.0.0"
description = "Open-source job finder: rank live openings from 300+ company career sites against your CV, experience and expectations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31", "pyyaml>=6", "flask>=3", "pypdf>=4", "python-docx>=1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobhunter = "jobhunter.cli:main"

[tool.setuptools.packages.find]
include = ["jobhunter*"]

[tool.setuptools.package-data]
jobhunter = ["data/*.yaml", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
